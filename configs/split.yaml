# データ分割の定義(1か所にまとめる)。決定: 2026-10-08(docs/VARIABLES.md §6)。**実装は未**(まだ使われていない)。
# 方式: 時間順の walk-forward(拡張窓)。年ごとに「その年より前」で学習し、その年をテストする。
# 学習とテストの境界に embargo_days の空きを置く(目的変数が t+1〜t+5 の価格を使うため)。
# 同じ日の行は、必ず同じ側に入れる。シャッフルしない。

study1:                    # 研究1(市場レベル。S&P500、日単位)
  rows: "営業日 3,499日(2008-01-31〜2021-12-23)"
  first_train: {start: "2008-01-31", end: "2012-12-31"}   # 最初の学習(約35%)
  test_years: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021]
  embargo_days: 4
  development: {first: 2013, last: 2017}   # 設定(ハイパーパラメータ・特徴量)を決める期間
  confirmation: {first: 2018, last: 2021}  # 最後に1回だけ評価する期間
  inner_validation: {share: 0.2, order: "time"}   # 各回の学習期間の最後の20%(時間順)で、木の数を決める

study2:                    # 研究2(銘柄レベル。ニュースのある(銘柄,日))
  first_train: {start: "2009-04-29", end: "2012-12-31"}
  test_periods: [2013, 2014, 2015, 2016, 2017, 2018, 2019, "2020-01-01:2020-06-12"]
  embargo_days: 4
  development: {first: 2013, last: 2016}
  confirmation: {first: 2017, last: 2020}
  inner_validation: {share: 0.2, order: "time"}
