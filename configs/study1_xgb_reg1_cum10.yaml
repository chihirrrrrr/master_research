# 目的変数を10日累積リターン(spx_cum_fwd10)にした版。境界の空きは 9 営業日(目的変数が t+1〜t+10 を使うため)。モデルの設定は study1_xgb_reg1.yaml と同じ。2026-11-19。
# 研究1のXGBoost: 正則化を強めた設定(中程度)。2026-10-08。出発点(study1_xgb.yaml)との違い:
# 木を浅く(深さ1〜2)、葉の最小サンプルを大きく(50〜100)、学習率を下げ(0.02)、列の抽出率を下げ(0.5)、正則化を強める(reg_lambda 50)。
target: spx_cum_fwd10
embargo_days: 9
model:
  n_estimators_max: 400
  early_stopping_rounds: 30
  learning_rate: 0.02
  subsample: 0.7
  colsample_bytree: 0.5
  reg_lambda: 50
  grid:
    max_depth: [1, 2]
    min_child_weight: [50, 100]
  seeds: [0, 1, 2, 3, 4]
