args:
  features: numeric
  periods: dev
  final: false
  model: xgboost
  row_set: common
  model_config: configs/study1_xgb_reg1.yaml
split:
  rows: 営業日 3,499日(2008-01-31〜2021-12-23)
  first_train:
    start: '2008-01-31'
    end: '2012-12-31'
  test_years:
  - 2013
  - 2014
  - 2015
  - 2016
  - 2017
  - 2018
  - 2019
  - 2020
  - 2021
  embargo_days: 4
  development:
    first: 2013
    last: 2017
  confirmation:
    first: 2018
    last: 2021
  inner_validation:
    share: 0.2
    order: time
model:
  target: spx_ret_fwd5
  model:
    n_estimators_max: 400
    early_stopping_rounds: 30
    learning_rate: 0.02
    subsample: 0.7
    colsample_bytree: 0.5
    reg_lambda: 50
    grid:
      max_depth:
      - 1
      - 2
      min_child_weight:
      - 50
      - 100
    seeds:
    - 0
    - 1
    - 2
    - 3
    - 4
